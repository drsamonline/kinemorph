name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Local references
        run: node tools/check-links.mjs

      - name: Manifest is complete
        run: node tools/manifest.mjs --check

      - name: Install a browser for the tests
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: The committed build is up to date
        run: |
          if [ -n "$(git status --porcelain studio)" ]; then
            echo "studio/ is out of date — run 'npm run build' and commit the result."
            git status --porcelain studio
            exit 1
          fi
          echo "studio/ matches the sources."
